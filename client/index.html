<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1018" />
    <meta name="description" content="Mausam — India Meteorological Department's weather app, personalised around how you actually use the forecast." />
    <title>Mausam</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded as separate requests: if one family is unavailable it fails alone
         rather than taking the whole stylesheet down with it. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400..700&display=swap" />
    <!-- Devanagari. Google Sans Flex has no Devanagari coverage, so Hindi would
         otherwise fall through to whatever the device happens to have. Google
         Fonts subsets by unicode-range, so an English session downloads the
         stylesheet and none of the font bytes. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300..800&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
